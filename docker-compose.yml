services:
  traefik:
    image: traefik:v3.0
    container_name: pebl-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=sasha.bobyliev@mail.ru"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt/acme.json:/letsencrypt/acme.json
    networks:
      - pebl

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: pebl-app
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_KEY=${APP_KEY} 
    volumes:
      - app-storage:/var/www/storage
      - app-bootstrap:/var/www/bootstrap/cache
      - ./.env:/var/www/.env:ro
    networks:
      - pebl
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: pebl-web
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pebl
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pebl.rule=Host(`pebl.fun`)"
      - "traefik.http.routers.pebl.entrypoints=websecure"
      - "traefik.http.routers.pebl.tls.certresolver=myresolver"
      - "traefik.http.services.pebl.loadbalancer.server.port=80"

      - "traefik.http.routers.pebl-redirect.rule=Host(`www.pebl.fun`)"
      - "traefik.http.routers.pebl-redirect.middlewares=redirect-to-non-www"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.regex=https://www.pebl.fun/(.*)"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.replacement=https://pebl.fun/$${1}"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.permanent=true"

      - "traefik.http.routers.pebl-http.rule=Host(`pebl.fun`) || Host(`www.pebl.fun`)"
      - "traefik.http.routers.pebl-http.entrypoints=web"
      - "traefik.http.routers.pebl-http.middlewares=http-to-https"
      - "traefik.http.middlewares.http-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.http-to-https.redirectscheme.permanent=true"

  db:
    image: mysql:8.0
    container_name: pebl-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pebl
    healthcheck:
      test: ["CMD", "bash", "-c", "mysql -uroot -p${DB_ROOT_PASSWORD} -e 'SELECT 1'"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 120s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pebl-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - app-storage:/var/www/storage
      - app-bootstrap:/var/www/bootstrap/cache
    networks:
      - pebl
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pebl-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        (php artisan schedule:run || true);
        sleep 60;
      done"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - app-storage:/var/www/storage
      - app-bootstrap:/var/www/bootstrap/cache
    networks:
      - pebl
    depends_on:
      db:
        condition: service_healthy

networks:
  pebl:
    driver: bridge

volumes:
  db-data:
  app-storage:
  app-bootstrap: